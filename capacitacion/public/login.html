<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Viajes Nova Academia — Ingreso</title>
  <link rel="stylesheet" href="css/academia.css" />
  <script src="config.js"></script>
</head>
<body>
  <div class="login-wrap">
    <form class="login-card" id="loginForm">
      <div class="wordmark">
        <div class="v"><svg viewBox="0 0 44 34" fill="none" xmlns="http://www.w3.org/2000/svg"><defs><linearGradient id="vg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8b5cf6"/><stop offset="1" stop-color="#6d28d9"/></linearGradient></defs><path d="M1 2h10l8.5 17L28 2h10L23 32h-6L1 2Z" fill="url(#vg)"/><path d="M21 12.5 27 2h10L26.5 22 21 12.5Z" fill="#a855f7" opacity=".55"/></svg></div>
        <div class="txt"><b>VIAJES NOVA</b><small>Academia</small></div>
      </div>
      <h1>Bienvenido</h1>
      <p class="sub">Ingresa para continuar tu formación.</p>

      <label for="username">Usuario</label>
      <input id="username" name="username" autocomplete="username" autofocus required />

      <label for="password">Contraseña</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required />

      <div class="err" id="err"></div>

      <div style="margin-top:22px">
        <button class="btn block" type="submit" id="submitBtn">Ingresar</button>
      </div>
    </form>
  </div>

  <script src="js/common.js"></script>
  <script>
    const form = document.getElementById('loginForm');
    const err = document.getElementById('err');
    const btn = document.getElementById('submitBtn');

    api('/auth/me').then(() => { location.href = BASE + '/'; }).catch(() => {});

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      err.classList.remove('show');
      btn.disabled = true; btn.textContent = 'Ingresando…';
      try {
        await api('/auth/login', { method: 'POST', body: {
          username: document.getElementById('username').value,
          password: document.getElementById('password').value,
        }});
        location.href = BASE + '/';
      } catch (e2) {
        err.textContent = e2.message; err.classList.add('show');
        btn.disabled = false; btn.textContent = 'Ingresar';
      }
    });
  </script>
</body>
</html>
