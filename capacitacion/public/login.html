<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Capacitación Nova — Ingreso</title>
  <link rel="stylesheet" href="css/styles.css" />
  <script src="config.js"></script>
</head>
<body>
  <div class="login-wrap">
    <form class="login-card" id="loginForm">
      <div class="brand">
        <div class="logo">N</div>
        <div>Capacitación <span style="color:var(--brand)">Nova</span><br><small>Área de capacitación</small></div>
      </div>
      <h1>Bienvenido</h1>
      <p class="sub">Ingresa con tu usuario y contraseña.</p>

      <label for="username">Usuario</label>
      <input id="username" name="username" autocomplete="username" autofocus required />

      <label for="password">Contraseña</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required />

      <div class="error-msg" id="err"></div>

      <div style="margin-top:20px">
        <button class="btn block" type="submit" id="submitBtn">Ingresar</button>
      </div>
    </form>
  </div>

  <script src="js/common.js"></script>
  <script>
    const form = document.getElementById('loginForm');
    const err = document.getElementById('err');
    const btn = document.getElementById('submitBtn');

    // If already logged in, go straight in
    api('/auth/me').then(({ user }) => {
      location.href = BASE + (user.role === 'admin' ? '/' : '/');
    }).catch(() => {});

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      err.classList.remove('show');
      btn.disabled = true; btn.textContent = 'Ingresando…';
      try {
        await api('/auth/login', {
          method: 'POST',
          body: {
            username: document.getElementById('username').value,
            password: document.getElementById('password').value,
          },
        });
        location.href = BASE + '/';
      } catch (e2) {
        err.textContent = e2.message;
        err.classList.add('show');
        btn.disabled = false; btn.textContent = 'Ingresar';
      }
    });
  </script>
</body>
</html>
