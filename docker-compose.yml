services:
  # ============================================
  # WAHA PLUS - WhatsApp HTTP API
  # Permite crear workers y bots de WhatsApp
  # ============================================
  waha:
    image: devlikeapro/waha-plus:latest
    container_name: waha
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      # Seguridad
      - WAHA_API_KEY=${WAHA_API_KEY}
      - WAHA_DASHBOARD_USERNAME=${WAHA_DASHBOARD_USERNAME:-admin}
      - WAHA_DASHBOARD_PASSWORD=${WAHA_DASHBOARD_PASSWORD}
      - WHATSAPP_SWAGGER_USERNAME=${WHATSAPP_SWAGGER_USERNAME:-admin}
      - WHATSAPP_SWAGGER_PASSWORD=${WHATSAPP_SWAGGER_PASSWORD}
      
      # WAHA Plus
      - WAHA_PLUS_VERSION=${WAHA_PLUS_VERSION:-latest}
      
      # Dashboard y Swagger
      - WAHA_DASHBOARD_ENABLED=${WAHA_DASHBOARD_ENABLED:-true}
      - WHATSAPP_SWAGGER_ENABLED=${WHATSAPP_SWAGGER_ENABLED:-true}
      
      # Engine (NOWEB para mejor rendimiento)
      - WHATSAPP_DEFAULT_ENGINE=${WHATSAPP_DEFAULT_ENGINE:-NOWEB}
      
      # URLs
      - WAHA_BASE_URL=${WAHA_BASE_URL}
      
      # Logging
      - WAHA_LOG_FORMAT=${WAHA_LOG_FORMAT:-PRETTY}
      - WAHA_LOG_LEVEL=${WAHA_LOG_LEVEL:-info}
      - WAHA_PRINT_QR=${WAHA_PRINT_QR:-false}
      
      # Media Storage
      - WAHA_MEDIA_STORAGE=${WAHA_MEDIA_STORAGE:-LOCAL}
      - WHATSAPP_FILES_LIFETIME=${WHATSAPP_FILES_LIFETIME:-0}
      - WHATSAPP_FILES_FOLDER=${WHATSAPP_FILES_FOLDER:-/app/.media}
      
      # Webhooks - Apunta al servicio express
      - WHATSAPP_HOOK_URL=http://express:4000/webhooks/waha
      - WHATSAPP_HOOK_EVENTS=${WHATSAPP_HOOK_EVENTS:-session.status,message,message.ack,message.reaction}
    volumes:
      - waha_data:/app/.waha
      - waha_sessions:/app/.sessions
      - waha_media:/app/.media
    networks:
      - crm_network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "--header=X-Api-Key:${WAHA_API_KEY}", "http://localhost:3000/api/server/status"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ============================================
  # EXPRESS API - Backend del CRM
  # Utiliza endpoints de WAHA para alimentar la BD
  # ============================================
  express:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: crm-express
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      # Puerto
      - PORT=4000
      
      # WAHA - Conexión interna entre contenedores
      - WAHA_API_KEY=${WAHA_API_KEY}
      - WAHA_BASE_URL=http://waha:3000
      
      # Supabase - Almacenamiento de toda la base de datos
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - SUPABASE_STORAGE_BUCKET=${SUPABASE_STORAGE_BUCKET:-whatsapp}
      
      # OpenAI (opcional - para transcripción de audios)
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      
      # Node
      - NODE_ENV=production
    depends_on:
      waha:
        condition: service_healthy
    networks:
      - crm_network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:4000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # ============================================
  # DASHBOARD - Frontend Next.js
  # Consume toda la base de datos de Supabase
  # ============================================
  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
      args:
        # Build args para Next.js (necesarios en build time)
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
        OPENAI_API_KEY: ${OPENAI_API_KEY}
    container_name: crm-dashboard
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      # Next.js
      - NODE_ENV=production
      - PORT=3000
      
      # Supabase - Acceso directo a la base de datos
      - NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL}
      - NEXT_PUBLIC_SUPABASE_ANON_KEY=${NEXT_PUBLIC_SUPABASE_ANON_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    networks:
      - crm_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  crm_network:
    driver: bridge

volumes:
  waha_data:
    driver: local
  waha_sessions:
    driver: local
  waha_media:
    driver: local
