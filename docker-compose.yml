services:
  # ============================================
  # WAHA PLUS - WhatsApp HTTP API
  # Permite crear workers y bots de WhatsApp
  # ============================================
  waha:
    image: devlikeapro/waha:noweb
    container_name: waha
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      # Seguridad
      - WAHA_API_KEY=${WAHA_API_KEY}
      - WAHA_DASHBOARD_USERNAME=${WAHA_DASHBOARD_USERNAME:-admin}
      - WAHA_DASHBOARD_PASSWORD=${WAHA_DASHBOARD_PASSWORD}
      - WHATSAPP_SWAGGER_USERNAME=${WHATSAPP_SWAGGER_USERNAME:-admin}
      - WHATSAPP_SWAGGER_PASSWORD=${WHATSAPP_SWAGGER_PASSWORD}
      
      # WAHA Plus
      - WAHA_PLUS_VERSION=${WAHA_PLUS_VERSION:-latest}
      
      # Dashboard y Swagger
      - WAHA_DASHBOARD_ENABLED=${WAHA_DASHBOARD_ENABLED:-true}
      - WHATSAPP_SWAGGER_ENABLED=${WHATSAPP_SWAGGER_ENABLED:-true}
      
      # Engine (NOWEB para mejor rendimiento)
      - WHATSAPP_DEFAULT_ENGINE=${WHATSAPP_DEFAULT_ENGINE:-NOWEB}
      
      # URLs
      - WAHA_BASE_URL=${WAHA_BASE_URL}
      
      # Logging
      - WAHA_LOG_FORMAT=${WAHA_LOG_FORMAT:-PRETTY}
      - WAHA_LOG_LEVEL=${WAHA_LOG_LEVEL:-info}
      - WAHA_PRINT_QR=${WAHA_PRINT_QR:-false}
      
      # Media Storage
      - WAHA_MEDIA_STORAGE=${WAHA_MEDIA_STORAGE:-LOCAL}
      - WHATSAPP_FILES_LIFETIME=${WHATSAPP_FILES_LIFETIME:-0}
      - WHATSAPP_FILES_FOLDER=${WHATSAPP_FILES_FOLDER:-/app/.media}
      
      # Webhooks - Apunta al servicio express
      - WHATSAPP_HOOK_URL=http://express:4000/webhooks/waha
      - WHATSAPP_HOOK_EVENTS=${WHATSAPP_HOOK_EVENTS:-session.status,message,message.ack,message.reaction}
    volumes:
      - waha_data:/app/.waha
      - waha_sessions:/app/.sessions
      - waha_media:/app/.media
    networks:
      - crm_network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "--header=X-Api-Key:${WAHA_API_KEY}", "http://localhost:3000/api/server/status"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ============================================
  # EXPRESS API - Backend del CRM
  # Utiliza endpoints de WAHA para alimentar la BD
  # ============================================
  express:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: crm-express
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      # Puerto
      - PORT=4000
      
      # WAHA - Conexión al servidor remoto
      - WAHA_API_KEY=${WAHA_API_KEY}
      - WAHA_BASE_URL=${WAHA_BASE_URL}
      
      # Supabase - Almacenamiento de toda la base de datos
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - SUPABASE_STORAGE_BUCKET=${SUPABASE_STORAGE_BUCKET:-whatsapp}
      
      # OpenAI (opcional - para transcripción de audios)
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      
      # Node
      - NODE_ENV=production

      # Backend propio (gateway NestJS) + credenciales de servicio
      - GATEWAY_URL=${GATEWAY_URL}
      - SERVICE_EMAIL=${SERVICE_EMAIL}
      - SERVICE_PASSWORD=${SERVICE_PASSWORD}
      - STORAGE_PUBLIC_BASE=https://api.viajesnovatour.com/api
    # depends_on: # Removido - usamos WAHA remoto
    #   waha:
    #     condition: service_healthy
    networks:
      - crm_network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:4000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # ============================================
  # DASHBOARD - Frontend Next.js
  # Consume toda la base de datos de Supabase
  # ============================================
  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
      args:
        # Build args para Next.js (necesarios en build time)
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
        OPENAI_API_KEY: ${OPENAI_API_KEY}
        GOOGLE_API_KEY: ${GOOGLE_API_KEY}
    container_name: crm-dashboard
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      # Next.js
      - NODE_ENV=production
      - PORT=3000
      
      # Supabase - Acceso directo a la base de datos
      - NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL}
      - NEXT_PUBLIC_SUPABASE_ANON_KEY=${NEXT_PUBLIC_SUPABASE_ANON_KEY}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}

      # Backend propio (gateway NestJS) para rutas server-side (app/api/*)
      - GATEWAY_URL=${GATEWAY_URL}
      - SERVICE_EMAIL=${SERVICE_EMAIL}
      - SERVICE_PASSWORD=${SERVICE_PASSWORD}
    networks:
      - crm_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ============================================
  # AI-AUDITOR - Microservicio de Auditoría (Gemini 3.5 Flash)
  # Corre en segundo plano evaluando chats
  # ============================================
  ai-auditor:
    build:
      context: ./ai-auditor
      dockerfile: Dockerfile
    container_name: crm-ai-auditor
    restart: unless-stopped
    environment:
      # Backend propio (gateway NestJS) — ya no Supabase
      - GATEWAY_URL=${GATEWAY_URL}
      - SERVICE_EMAIL=${SERVICE_EMAIL}
      - SERVICE_PASSWORD=${SERVICE_PASSWORD}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - TZ=America/Caracas
    networks:
      - crm_network

  # ============================================
  # CAPACITACIÓN NOVA - Plataforma de cursos
  # Proyecto independiente con su propia base de datos (Postgres)
  # Se sirve bajo crm.novapolointranet.xyz/capacitacion (via Caddy)
  # ============================================
  capacitacion-db:
    image: postgres:16-alpine
    container_name: capacitacion-db
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${CAP_DB_USER:-capacitacion}
      - POSTGRES_PASSWORD=${CAP_DB_PASSWORD}
      - POSTGRES_DB=${CAP_DB_NAME:-capacitacion}
    volumes:
      - capacitacion_db:/var/lib/postgresql/data
    networks:
      - crm_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${CAP_DB_USER:-capacitacion} -d ${CAP_DB_NAME:-capacitacion}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  capacitacion:
    build:
      context: ./capacitacion
      dockerfile: Dockerfile
    container_name: capacitacion-nova
    restart: unless-stopped
    ports:
      - "4100:4100"
    environment:
      - NODE_ENV=production
      - PORT=4100
      - BASE_PATH=/capacitacion
      - DATABASE_URL=postgres://${CAP_DB_USER:-capacitacion}:${CAP_DB_PASSWORD}@capacitacion-db:5432/${CAP_DB_NAME:-capacitacion}
      - SESSION_SECRET=${CAP_SESSION_SECRET}
      - ADMIN_USERNAME=${CAP_ADMIN_USERNAME:-admin}
      - ADMIN_PASSWORD=${CAP_ADMIN_PASSWORD}
    depends_on:
      capacitacion-db:
        condition: service_healthy
    networks:
      - crm_network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:4100/capacitacion/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

networks:
  crm_network:
    driver: bridge

volumes:
  capacitacion_db:
    driver: local
  waha_data:
    driver: local
  waha_sessions:
    driver: local
  waha_media:
    driver: local
